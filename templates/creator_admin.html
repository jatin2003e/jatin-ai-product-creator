{% extends 'base.html' %}{% block content %}<h1>AI content studio</h1><form method="post" class="card"><label>Product type</label><select name="kind">{% for t in types %}<option>{{t}}</option>{% endfor %}</select><label>Topic</label><input name="topic" required><label>Audience</label><input name="audience" placeholder="Freelancers in India"><label>Tone</label><input name="tone" value="Professional"><button>Generate and save</button></form><h2>Saved drafts</h2>{% for d in drafts %}<div class="card"><h3>{{d.title}} ({{d.kind}})</h3><pre>{{d.body}}</pre><a class="btn" href="/export/{{d.id}}">Download Markdown</a></div>{% endfor %}{% endblock %}
